    <style>
      .preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background: #fff;
        opacity: 1;
        visibility: visible;
        transition:
          opacity .35s ease,
          visibility .35s ease;
      }

      .preloader__loader {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(0,0,0,.12);
        border-top-color: currentColor;
        border-radius: 50%;
        animation:
          preloader-spin
          .8s linear infinite;
      }

      .preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
